<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GetSet</title>
<meta name="theme-color" content="#07081a">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* GetSet · how long getting ready for office takes, step by step. Aurora Pulse. */
:root{
  --bg:#07081a; --s1:#10122b; --s2:#171a3a; --s3:#22264f; --line:#262b58; --line2:#353b72;
  --text:#f1f2ff; --muted:#a3a8d6; --faint:#646a9e;
  --cyan:#2ec5ff; --vio:#7c5cff; --pink:#ff4fa3; --grad:linear-gradient(135deg,#ff4fa3,#7c5cff 50%,#2ec5ff);
  --up:#2ee59d; --dn:#ff5d73; --gold:#ffc54d;
  --disp:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@font-face{font-family:'Emo';src:local('Noto Color Emoji'),local('Apple Color Emoji'),local('Segoe UI Emoji'),local('SamsungColorEmoji');unicode-range:U+2600-27BF,U+1F000-1FAFF,U+FE0F,U+200D,U+2B50,U+2705,U+23F0}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body),'Emo';max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 98px);user-select:none;min-height:100vh}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(34% 26% at 8% 10%,color-mix(in srgb,var(--vio) 30%,transparent),transparent 70%),radial-gradient(30% 24% at 95% 28%,color-mix(in srgb,var(--cyan) 16%,transparent),transparent 70%),radial-gradient(32% 26% at 30% 92%,color-mix(in srgb,var(--pink) 13%,transparent),transparent 70%);animation:aur 20s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(-5%,4%) rotate(4deg) scale(1.06)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{min-height:70px;resize:vertical}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.up{color:var(--up)}.dn{color:var(--dn)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px -4px var(--vio);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite}
.mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:1.6px;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-1px;white-space:nowrap}
@keyframes shim{to{background-position:300% 0}}
.hb{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--muted);position:relative;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.92)}
.wbadge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--pink);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}

/* cards */
.card{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),var(--s1);border:1px solid color-mix(in srgb,var(--vio) 22%,transparent);border-radius:24px;padding:14px;margin-bottom:12px;position:relative;box-shadow:0 18px 40px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.ch span,.ch button.lnk{font-size:11.5px;color:var(--faint)}
.lnk{color:var(--cyan)!important;font-weight:700}
#view>*{animation:rise .45s both}#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(5){animation-delay:.16s}
#view.l>*{animation-name:slideL}#view.r>*{animation-name:slideR}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes sonar{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.45);opacity:0}}

/* hero ring */
.hero{padding:14px 14px 14px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 220px at 50% 38%,color-mix(in srgb,var(--rc,var(--vio)) 22%,transparent),transparent 70%);pointer-events:none;transition:background .6s}
.ringw{position:relative;width:236px;height:236px;margin:2px auto 4px}
.ringw .son{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite;pointer-events:none}
.ringw .son.b{border-color:var(--vio);animation-delay:1.2s}.ringw .son.c{border-color:var(--pink);animation-delay:2.4s}
.ringw.idle .son,.ringw.paused .son{animation-play-state:paused;opacity:0}
.ringw svg{width:100%;height:100%;overflow:visible;display:block}
.arc{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.live{animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{opacity:.75}}
.head{animation:headp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes headp{50%{transform:scale(1.35)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.rc .k{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.rc .t{font-family:var(--disp);font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.rc .t small{font-size:22px;color:var(--muted);letter-spacing:0}
.rc .s{font-size:12px;color:var(--muted);margin-top:2px}
.nowpill{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:#fff;box-shadow:0 0 18px -6px var(--c)}
.nowpill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:glowp 1s infinite}
.paused .nowpill{opacity:.6}
.eta{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:8px 0 12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--ec,var(--cyan)) 13%,var(--s2));border:1px solid color-mix(in srgb,var(--ec,var(--cyan)) 45%,transparent);font-size:13.5px;line-height:1.35}
.eta .ei{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--ec,var(--cyan)) 25%,transparent);flex:none}
.eta b{color:var(--ec,var(--cyan))}
.eta .go{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.ctl{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.cb{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 6px;border-radius:16px;font-weight:800;font-size:14px;background:var(--s2);border:1px solid var(--line2);transition:transform .12s}
.cb:active{transform:scale(.95)}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 12px 26px -12px var(--vio);position:relative;overflow:hidden}
.cb.pri::after,.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.cb.go{background:linear-gradient(135deg,#2ee59d,#12b878);color:#04140c;border:0;box-shadow:0 10px 24px -12px #2ee59d}
.cb:disabled{opacity:.4}
.banner{padding:11px 12px;border-radius:16px;margin-bottom:12px;background:color-mix(in srgb,var(--gold) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px}
.banner .acts{margin-top:8px}

/* step tiles */
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{position:relative;overflow:hidden;text-align:left;border-radius:19px;padding:10px 9px 9px;min-height:86px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) calc(var(--tp,100%) * .95),transparent),color-mix(in srgb,color-mix(in srgb,var(--c) 45%,#0b0c22) var(--tp,100%),transparent));
  box-shadow:0 10px 22px -14px var(--c),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .15s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.tl::before{content:"";position:absolute;inset:0;background:radial-gradient(110px 70px at 0 0,rgba(255,255,255,.26),transparent 70%);pointer-events:none}
.tl::after{content:"";position:absolute;width:70px;height:70px;right:-24px;bottom:-28px;border-radius:50%;border:10px solid rgba(255,255,255,.09);pointer-events:none}
.tl:active{transform:scale(.94)}
.tl>*{position:relative;z-index:1}
.tl .e{font-size:22px;line-height:1}
.tl .n{font-size:12px;font-weight:800;line-height:1.15;margin-top:5px}
.tl .m{font-size:11.5px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.tl .m small{font-weight:600;opacity:.8}
.tl .pb{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85);border-radius:0 3px 3px 0;z-index:2;transition:width 1s linear}
.tl.done{filter:saturate(.55) brightness(.8)}
.tl.done .ck{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);color:#10122b;display:grid;place-items:center;font-size:11px;font-weight:900;z-index:2;animation:pop .4s both}
.tl.act{outline:2px solid rgba(255,255,255,.95);outline-offset:-2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 12px 30px -8px var(--c);transform:translateY(-2px)}
.tl.act .lv{position:absolute;top:7px;right:7px;font-size:8.5px;font-weight:900;letter-spacing:.6px;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.35);z-index:2}
.tl.act .lv::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:4px;vertical-align:1px;animation:glowp 1s infinite}
.tl.noest .m::after{content:" · not in ETA";font-weight:600;opacity:.7}
.tl.add{background:var(--s1);border:1.5px dashed var(--line2);box-shadow:none;color:var(--muted);align-items:flex-start}
.tl.add::before,.tl.add::after{display:none}
.lt{color:#10131a!important}

/* strip */
.strip{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--s3);margin:2px 0 8px}
.strip i{display:block;height:100%;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both;border-right:1.5px solid var(--s1)}
@keyframes growx{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* list rows */
.lap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.lap:last-child{border-bottom:0}
.lap .e{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.lap .n{font-weight:700;font-size:14px}.lap .s{font-size:11.5px;color:var(--faint)}
.lap .v{text-align:right;font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.lap .v small{display:block;font-family:var(--body);font-size:11px;font-weight:700}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{border-radius:18px;padding:11px 12px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,var(--vio)) 22%,var(--s2)),var(--s1));border:1px solid color-mix(in srgb,var(--c,var(--vio)) 35%,transparent);min-width:0;animation:pop .45s both}
.kpi .k{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--faint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:8px 4px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13px;transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px var(--vio)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.gb{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes growy{from{transform:scaleY(0)}}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.3s .1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sb{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.sb .tr{height:10px;border-radius:99px;background:var(--s3);overflow:hidden}
.sb .tr b{display:block;height:100%;border-radius:99px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both}
.sb .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.ins div{font-size:13px;padding:9px 12px;border-radius:13px;background:var(--s2);border-left:3px solid var(--c,var(--vio));margin-top:7px}

/* calendar */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pnav h2{margin:0;text-align:center;font-family:var(--disp);font-size:18px}.pnav h2 small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:600}
.dow,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow div{text-align:center;font-size:10.5px;color:var(--faint);font-weight:800;padding-bottom:4px}
.cd{aspect-ratio:1/1.15;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;animation:pop .4s both}
.cd.has{background:color-mix(in srgb,var(--c) 26%,var(--s2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.cd.blank{background:none;border:0;animation:none}.cd.fut{opacity:.3}.cd.td{box-shadow:0 0 0 2px var(--cyan)}.cd.sel{box-shadow:0 0 0 2px var(--pink)}
.cd .n{position:absolute;top:3px;left:5px;font-size:9.5px;color:var(--muted);font-weight:700}
.cd .v{font-family:var(--disp);font-size:12px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.cgrid.fl{animation:flipm .45s both}@keyframes flipm{from{transform:perspective(600px) rotateX(-70deg);opacity:0}}

/* records */
.rec{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 22%,var(--s2))}
.rec .v{font-family:var(--disp);font-weight:800;font-size:17px;text-align:right}.rec .v small{display:block;font-family:var(--body);font-size:11px;color:var(--faint);font-weight:600}
.trophy{text-align:center;padding:6px 0 4px}.trophy .big{font-size:54px;animation:float 3s ease-in-out infinite;display:inline-block}
@keyframes float{50%{transform:translateY(-6px)}}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tb.on{color:var(--text)}.tb.on svg{color:var(--cyan);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cyan) 80%,transparent));transform:translateY(-2px) scale(1.12)}
.fab{width:60px;height:60px;margin:-28px auto 0;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px var(--vio);animation:fabg 3s ease-in-out infinite;transition:transform .2s}
.fab svg{width:26px;height:26px;fill:#fff}
.fab:active{transform:scale(.9) rotate(20deg)}
@keyframes fabg{50%{box-shadow:0 0 0 5px var(--bg),0 0 36px 4px color-mix(in srgb,var(--vio) 75%,transparent)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(3,2,12,.62);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,color-mix(in srgb,var(--vio) 12%,var(--s1)),var(--s1));border:1px solid var(--line2);border-bottom:0;border-top-color:var(--vio);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s;box-shadow:0 -20px 50px -20px color-mix(in srgb,var(--vio) 60%,transparent)}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-size:19px}
.sheet h4{margin:16px 0 6px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.btn{display:block;width:100%;padding:13px;border-radius:15px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center;transition:transform .12s;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -12px var(--vio)}
.btn.danger{color:var(--dn)}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:12px;border-radius:10px}
.btn.armed{background:var(--dn);color:#fff;border-color:var(--dn)}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}

/* emoji picker */

/* toast + fx */

<script>
(() => {
'use strict';
/* ===================== config ===================== */
const KEY = 'getset.v1', MIN = 60000, DAY = 86400000;
const DEF_STEPS = [
  ['dress','Dress selection','👔','#7c5cff',4],['table','Table setup','🍽️','#2ec5ff',5],['brush','Brushing','🪥','#1fd68a',4],['rest','Restroom','🚻','#ffb020',6],
  ['bath','Bathing','🛁','#ff4fa3',12],['dressup','Dress up','👕','#9b3fd6',7],['makeup','Makeup','💄','#f0428f',3],['bfast','Breakfast','🍳','#ff6a13',12],
  ['lunch','Lunch','🍱','#12a874',4],['dinner','Dinner','🍛','#e8364a',4],['shoe','Shoe polish','👞','#f59f00',3],['rapido','Rapido booking','🛵','#3d63e0',2],
].map(([id, n, e, c, m]) => ({id, n, e, c, m, est:true, off:false}));
const PAL = ['#7c5cff','#2ec5ff','#1fd68a','#ffb020','#ff4fa3','#9b3fd6','#f0428f','#ff6a13','#12a874','#e8364a','#f59f00','#3d63e0','#0aa6d6','#8a3ffc'];
const fresh = () => ({steps:DEF_STEPS.map(s => ({...s})), sessions:[], active:null, settings:{sound:true, leave:'08:30', useLeave:true, staleH:4}, wish:[]});

/* ===================== state ===================== */
let S;
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); S = d && Array.isArray(d.sessions) ? {...fresh(), ...d, settings:{...fresh().settings, ...(d.settings || {})}} : fresh(); } catch(e) { S = fresh(); }
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
const UI = {tab:'today', range:30, calM:null, calSel:null};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pk = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dk(new Date());
const addK = (k, n) => { const d = pk(k); d.setDate(d.getDate() + n); return dk(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const hm = t => { const d = new Date(t), h = d.getHours(); return `${h % 12 || 12}:${pad(d.getMinutes())} ${h < 12 ? 'AM' : 'PM'}`; };
const t12s = s => { const [h, m] = String(s).split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const short = k => { const d = pk(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const longDay = k => { const d = pk(k); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const clockT = ms => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const mins = ms => { const m = Math.round(ms / MIN); return m >= 60 ? `${Math.floor(m / 60)}h ${pad(m % 60)}m` : `${m}m`; };
const mmss = ms => { const s = Math.round(Math.abs(ms) / 1000); return s >= 3600 ? mins(Math.abs(ms)) : `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const signed = ms => (ms >= 0 ? '+' : '−') + mmss(ms);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const sd = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(avg(a.map(x => (x - m) ** 2))); };
const step = id => S.steps.find(s => s.id === id) || {id, n:'Removed step', e:'•', c:'#646a9e', m:0, est:false, off:true};
const visible = () => S.steps.filter(s => !s.off);
const lightOf = hex => { const h = String(hex || '').replace('#', ''); if (h.length < 6) return 0; const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b; };

/* ===================== timing core ===================== */
// time that counts = wall time minus any paused stretches
const pausesOf = (s, now) => (s.pauses || []).concat(s.paused ? [{a:s.paused, b:now}] : []);
function activeMs(s, a, b, now = Date.now()){ let ms = b - a; for (const p of pausesOf(s, now)) { const o = Math.min(b, p.b) - Math.max(a, p.a); if (o > 0) ms -= o; } return Math.max(0, ms); }
const lapEnd = (s, l, now) => l.b ?? (s.paused || now);
const lapMs = (s, l, now = Date.now()) => activeMs(s, l.a, lapEnd(s, l, now), now);
const totalMs = (s, now = Date.now()) => s.laps.reduce((t, l) => t + lapMs(s, l, now), 0);
const activeS = () => S.sessions.find(s => s.id === S.active) || null;
const curLap = s => s && s.laps.length && s.laps[s.laps.length - 1].b == null ? s.laps[s.laps.length - 1] : null;
const done = () => S.sessions.filter(s => s.end && s.laps.length);
const stepMsIn = (s, id, now) => s.laps.filter(l => l.step === id).reduce((t, l) => t + lapMs(s, l, now), 0);
function stats(list = done()){
  const tot = list.map(s => totalMs(s)), per = {};
  S.steps.forEach(st => { const v = list.map(s => stepMsIn(s, st.id)).filter(x => x >= 10000); /* under 10 s = a mis-tap */ per[st.id] = {avg:avg(v), n:v.length, sd:sd(v), min:v.length ? Math.min(...v) : null, max:v.length ? Math.max(...v) : null}; });
  return {n:list.length, avg:avg(tot), per, tot};
}
const typical = (id, ST) => (ST.per[id] && ST.per[id].avg) || step(id).m * MIN;   // your average, or the minutes you set until there is history
// forecast: now + the typical time of every counted step not yet done (the live step only adds what is left of its typical time)
function forecast(s, ST, now = Date.now()){
  const doneIds = new Set(s ? s.laps.map(l => l.step) : []), cl = curLap(s);
  let left = 0;
  visible().filter(st => st.est).forEach(st => {
    if (cl && cl.step === st.id) left += Math.max(0, typical(st.id, ST) - lapMs(s, cl, now));
    else if (!doneIds.has(st.id)) left += typical(st.id, ST);
  });
  const startAt = s ? s.start : now, spent = s ? totalMs(s, now) : 0;
  const plan = visible().filter(st => st.est).reduce((t, st) => t + typical(st.id, ST), 0);
  return {left, finish:now + (s && s.paused ? 0 : 0) + left, spent, plan, ahead:plan - (spent + left)};
}
const leaveTs = () => { const [h, m] = (S.settings.leave || '08:30').split(':').map(Number), d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };

/* ===================== actions on the timer ===================== */
function startSession(firstStep){
  const now = Date.now(), s = {id:uid(), date:today(), start:now, end:null, laps:[], pauses:[], paused:null};
  S.sessions.push(s); S.active = s.id;
  if (firstStep) s.laps.push({step:firstStep, a:now, b:null});
  save(); snd('start'); vib([20, 40, 20]); return s;
}
function resume(s){ if (!s.paused) return; s.pauses.push({a:s.paused, b:Date.now()}); s.paused = null; }
function tapStep(id, el){
  let s = activeS(); const now = Date.now();
  if (!s) { s = startSession(id); burstAt(el, step(id).c); render(false); toast(`${step(id).e} ${esc(step(id).n)} · timer started`); return; }
  if (s.paused) resume(s);
  const cl = curLap(s);
  if (cl && cl.step === id) { toast(`${step(id).e} ${esc(step(id).n)} is already running`); return; }
  let closed = null;
  if (cl) { cl.b = now; closed = cl; }
  s.laps.push({step:id, a:now, b:null}); save(); snd('next'); vib(25); burstAt(el, step(id).c); render(false);
  if (closed) { const ms = lapMs(s, closed), ST = stats(), t = ST.per[closed.step] && ST.per[closed.step].avg;
    toast(`✓ ${step(closed.step).e} ${esc(step(closed.step).n)} ${mmss(ms)}${t ? ` <span class="${ms <= t ? 'up' : 'dn'}">(${signed(ms - t)})</span>` : ''} · now ${step(id).e} ${esc(step(id).n)}`, {label:'Undo', fn:() => undoTap(s.id, closed)}); }
}
function undoTap(sid, closed){ const s = S.sessions.find(x => x.id === sid); if (!s) return; s.laps.pop(); const l = s.laps[s.laps.length - 1]; if (l === closed || (l && l.a === closed.a)) l.b = null; save(); render(false); toast('Undone'); }
function nextStep(){
  const s = activeS(); if (!s) return;
  const doneIds = new Set(s.laps.map(l => l.step)), cl = curLap(s), list = visible();
  const from = cl ? list.findIndex(x => x.id === cl.step) : -1;
  const nx = list.slice(from + 1).concat(list.slice(0, from + 1)).find(x => !doneIds.has(x.id));
  if (!nx) return finish();
  tapStep(nx.id, document.querySelector(`[data-sid="${nx.id}"]`));
}
function pauseToggle(){
  const s = activeS(); if (!s) { startSession(null); render(false); toast('Timer started · tap your first step'); return; }
  if (s.paused) { resume(s); snd('start'); toast('▶ Resumed'); } else { s.paused = Date.now(); snd('pause'); toast('⏸ Paused · the clock stops until you resume'); }
  save(); vib(20); render(false);
}
function finish(at){
  const s = activeS(); if (!s) return;
  const end = at || (s.paused || Date.now());
  if (s.paused) { s.pauses.push({a:s.paused, b:end}); s.paused = null; }
  const cl = curLap(s); if (cl) cl.b = Math.max(cl.a, end);
  if (!s.laps.length) { S.sessions = S.sessions.filter(x => x !== s); S.active = null; save(); render(false); toast('Nothing was logged, so the session was dropped'); return; }
  s.end = end; S.active = null; save();
  const prev = stats(done().filter(x => x !== s)), tot = totalMs(s), best = prev.tot.length ? Math.min(...prev.tot) : null;
  snd('finish'); vib([30, 60, 30, 60, 60]); confetti(best != null && tot < best ? 120 : 70); render(false);
  toast(`🏁 Ready in <b>${mins(tot)}</b>${prev.avg ? ` · <span class="${tot <= prev.avg ? 'up' : 'dn'}">${signed(tot - prev.avg)} vs average</span>` : ''}${best != null && tot < best ? ' · 🏆 new record!' : ''}`);
}

/* ===================== render ===================== */
let lastTab = 'today';
const TABS = ['today','hist','stats','rec'];
function render(anim = true){

  if (!list.length) return `<section class="card empty"><span class="e">🏆</span>Your personal bests show up here after your first finished morning.</section>`;
  const tots = ST.tot, best = Math.min(...tots), bs = list[tots.indexOf(best)];
  const days = [...new Set(list.map(s => s.date))].sort(); let streak = 0, d = today(); if (!days.includes(d)) d = addK(d, -1); while (days.includes(d)) { streak++; d = addK(d, -1); }
  let longest = 0, run = 0, prev = null; days.forEach(k => { run = prev && addK(prev, 1) === k ? run + 1 : 1; longest = Math.max(longest, run); prev = k; });
  const under = ST.avg ? list.filter(s => totalMs(s) <= ST.avg).length : 0;
  let h = `<section class="card"><div class="trophy"><span class="big">🏆</span><div class="muted small" style="margin-top:4px">FASTEST MORNING</div><div style="font-family:var(--disp);font-size:34px;font-weight:800">${mins(best)}</div><div class="small muted">${longDay(bs.date)} · ${hm(bs.start)} → ${hm(bs.end)}</div></div></section>`;
  h += `<div class="kpis" style="margin-bottom:12px"><div class="kpi" style="--c:#ff9d4d"><div class="k">Streak</div><div class="v">🔥 ${streak}</div><div class="s">days in a row</div></div><div class="kpi" style="--c:#7c5cff"><div class="k">Longest streak</div><div class="v">${longest}</div><div class="s">days</div></div>
    <div class="kpi" style="--c:#2ee59d"><div class="k">Beat your average</div><div class="v">${under}/${list.length}</div><div class="s">mornings</div></div><div class="kpi" style="--c:#2ec5ff"><div class="k">Tracked</div><div class="v">${days.length}</div><div class="s">days since ${short(days[0])}</div></div></div>`;
  h += `<section class="card"><div class="ch"><h3>Best time per step</h3><span>personal records</span></div>${S.steps.filter(st => ST.per[st.id] && ST.per[st.id].min).map(st => { const p = ST.per[st.id];
    return `<div class="rec" style="--c:${st.c}"><span class="e">${st.e}</span><div><b>${esc(st.n)}</b><div class="small faint">avg ${mmss(p.avg)} · slowest ${mmss(p.max)}</div></div><div class="v up">${mmss(p.min)}<small>best of ${p.n}</small></div></div>`; }).join('')}</section>`;
  return h;
}

const WSCR = ['Today','History','Stats','Records','Steps','Estimate','Look','Other'], WST = {todo:['To do','#2ec5ff'], sent:['Sent','#ffb020'], done:['Done','#1fd68a']};
let WU = null;
function wishBadge(){ const b = $('wishBtn'); if (!b) return; const n = S.wish.filter(w => w.st === 'todo').length; let s = b.querySelector('.wbadge'); if (!n) { if (s) s.remove(); return; } if (!s) { s = document.createElement('span'); s.className = 'wbadge'; b.appendChild(s); } s.textContent = n; }
function sheetWish(){
  WU = WU || {text:'', scr:'Today', f:'todo'};
  const cnt = s => S.wish.filter(w => w.st === s).length, list = S.wish.filter(w => w.st === WU.f).sort((a, b) => b.t - a.t);
  sheet(`<h3>📝 App wishlist</h3><p class="small muted" style="margin-top:-6px">Note changes you want in GetSet. Copy them for Claude when you're ready.</p>
    <textarea id="wText" placeholder="e.g. Remind me at 7 AM to start">${esc(WU.text)}</textarea>
    <div class="fl">Which screen?</div><div class="chips">${WSCR.map(s => `<button class="chip${WU.scr === s ? ' on' : ''}" data-act="wscr" data-v="${s}">${s}</button>`).join('')}</div>
    <div class="acts"><button class="btn pri" data-act="wadd">＋ Add to wishlist</button></div>
    <div class="seg" style="margin-top:14px">${Object.entries(WST).map(([k, [l]]) => `<button class="${WU.f === k ? 'on' : ''}" data-act="wf" data-v="${k}">${l} ${cnt(k)}</button>`).join('')}</div>
    ${list.map(w => `<div class="wi" style="--c:${WST[w.st][1]}"><div><p>${esc(w.text)}</p><div class="d">${w.scr} · ${short(dk(new Date(w.t)))}, ${hm(w.t)}</div></div><div class="b">${w.st !== 'done' ? `<button data-act="wnext" data-id="${w.id}">${w.st === 'todo' ? 'Mark sent' : 'Mark done'}</button>` : `<button data-act="wback" data-id="${w.id}">Reopen</button>`}<button data-act="wdel" data-id="${w.id}" style="color:#ff8c96">Delete</button></div></div>`).join('') || `<div class="note">Nothing ${WST[WU.f][0].toLowerCase()} yet.</div>`}
    ${cnt('todo') ? `<div class="acts"><button class="btn" data-act="wcopy">Copy ${cnt('todo')} to-do item${cnt('todo') > 1 ? 's' : ''} for Claude</button></div>` : ''}`);
}
const wkeep = () => { const t = $('wText'); if (t && WU) WU.text = t.value; };
function wishText(){ const f = x => { const d = new Date(x); return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
  return `GetSet update wishlist (${f(Date.now())}):\n` + S.wish.filter(w => w.st === 'todo').sort((a, b) => a.t - b.t).map((w, i) => `${i + 1}. [${w.scr}] ${w.text} (${f(w.t)})`).join('\n'); }

/* ===================== sound · haptics · fx ===================== */
let AC = null, ECHO = null;
function snd(kind){
  if (!S.settings.sound) return;
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); const d = AC.createDelay(), f = AC.createBiquadFilter(), fb = AC.createGain(), wet = AC.createGain();
      d.delayTime.value = .17; f.type = 'lowpass'; f.frequency.value = 2600; fb.gain.value = .3; wet.gain.value = .45; d.connect(f); f.connect(fb); fb.connect(d); f.connect(wet); wet.connect(AC.destination); ECHO = d; }
    if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime, tone = (fr, st, du, type = 'sine', g = .07, f2) => { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(fr, now + st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + st + du);
      gn.gain.setValueAtTime(0, now + st); gn.gain.linearRampToValueAtTime(g, now + st + .012); gn.gain.exponentialRampToValueAtTime(.0001, now + st + du); o.connect(gn); gn.connect(AC.destination); gn.connect(ECHO); o.start(now + st); o.stop(now + st + du + .05); };
    if (kind === 'start') { tone(523, 0, .2, 'triangle', .06); tone(784, .08, .25, 'triangle', .06); tone(1047, .16, .35, 'sine', .05); }
    else if (kind === 'next') { tone(784, 0, .1, 'triangle', .06); tone(988, .07, .12, 'triangle', .06); tone(1319, .14, .22, 'sine', .05); }
    else if (kind === 'pause') { tone(700, 0, .25, 'sine', .06, 260); }
    else if (kind === 'finish') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .6, 'triangle', .06));
    else if (kind === 'tap') tone(1320, 0, .05, 'sine', .03);
    else if (kind === 'tab') { tone(900, 0, .06, 'sine', .03); tone(1320, .04, .07, 'sine', .025); }
    else if (kind === 'sheet') tone(660, 0, .09, 'sine', .03);
    else if (kind === 'save') { tone(520, 0, .3, 'sine', .06, 1040); tone(1560, .12, .2, 'sine', .03); }
    else if (kind === 'del') tone(300, 0, .25, 'sawtooth', .04, 80);
    else if (kind === 'err') tone(160, 0, .2, 'square', .03);
    else if (kind === 'theme') [392, 523, 659, 784].forEach((f, i) => tone(f, i * .06, .4, 'triangle', .045));
  } catch(e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e) {} };
function burstAt(el, col){ if (!el) return; const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < 16; i++) { const d = document.createElement('i'), a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 60; d.className = 'burst'; d.style.cssText = `left:${x}px;top:${y}px;background:${i % 3 ? col : '#fff'};--dx:${Math.cos(a) * s}px;--dy:${Math.sin(a) * s}px`; document.body.appendChild(d); setTimeout(() => d.remove(), 950); } }
function confetti(n = 70){ const cols = ['#2ec5ff','#7c5cff','#ff4fa3','#ffc54d','#2ee59d']; for (let i = 0; i < n; i++) { const d = document.createElement('i'); d.className = 'conf'; d.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % 5]};animation-delay:${Math.random() * .6}s;animation-duration:${2 + Math.random() * 1.4}s`; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); } }
let tt, undoFn = null;
function toast(msg, act){ const t = $('toast'); $('toastMsg').innerHTML = msg; t.classList.add('show'); const b = $('toastBtn');
  if (act) { b.hidden = false; b.textContent = act.label; undoFn = act.fn; } else { b.hidden = true; undoFn = null; }
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), act ? 5000 : 2600); }
$('toastBtn').onclick = () => { const f = undoFn; undoFn = null; $('toast').classList.remove('show'); if (f) f(); };
function arm(el, fn){ if (el.classList.contains('armed')) return fn(); el.classList.add('armed'); const t = el.textContent; el.textContent = 'Tap again to confirm'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = t; } }, 3000); }
function download(name, text, type){ const b = new Blob([text], {type}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); }

/* ===================== actions ===================== */
const A = {
  tab: el => { if (UI.tab === el.dataset.t) return; UI.tab = el.dataset.t; snd('tab'); render(); scrollTo(0, 0); },
  fab: () => { if (UI.tab !== 'today') { UI.tab = 'today'; render(); } pauseToggle(); },
  step: el => tapStep(el.dataset.sid, el),
  next: () => nextStep(),
  pause: () => pauseToggle(),
  finish: el => { const s = activeS(); if (!s) return; if (!el.classList.contains('armed') && visible().some(st => st.est && !s.laps.some(l => l.step === st.id))) return arm(el, finish); finish(); },
  finishat: el => finish(+el.dataset.t),
  discard: el => arm(el, () => { S.sessions = S.sessions.filter(s => s.id !== S.active); S.active = null; save(); render(false); toast('Session discarded'); }),
  close: () => closeSheet(),
  settings: () => sheetSettings(),
  estsheet: () => sheetEstimate(),
  steps: () => sheetSteps(),
  smove: el => { const i = S.steps.findIndex(s => s.id === el.dataset.id), j = i + +el.dataset.v; if (j < 0 || j >= S.steps.length) return; [S.steps[i], S.steps[j]] = [S.steps[j], S.steps[i]]; save(); snd('tap'); keepScroll(sheetSteps); },
  sadd: () => { const st = {id:'s' + uid(), n:'New step', e:'⭐', c:PAL[S.steps.length % PAL.length], m:5, est:true, off:false, custom:true}; S.steps.push(st); save(); snd('save'); keepScroll(sheetSteps, 99999); setTimeout(() => { const i = document.querySelector(`[data-sn="${st.id}"]`); if (i) { i.focus(); i.select(); } }, 350); },
  sdel: el => { if (S.sessions.some(s => s.laps.some(l => l.step === el.dataset.id))) { const st = S.steps.find(s => s.id === el.dataset.id); st.off = true; save(); toast('It has history, so it was hidden instead'); } else S.steps = S.steps.filter(s => s.id !== el.dataset.id); save(); snd('del'); keepScroll(sheetSteps); },
  emopen: el => emToggle(el.dataset.t),
  empick: el => { const t = el.dataset.t, e = el.dataset.e; if (t.startsWith('se_')) { const st = S.steps.find(s => s.id === t.slice(3)); if (st) { st.e = e; save(); } snd('tap'); keepScroll(sheetSteps); return; } const inp = $(t); if (inp) inp.value = e; const p = $('pk_' + t); if (p) p.remove(); },
  emtype: el => { const v = ($('emIn_' + el.dataset.t).value || '').trim(); if (!v || /^[\w\s.,]+$/.test(v)) { snd('err'); return toast('Type or paste an emoji'); } A.empick({dataset:{t:el.dataset.t, e:v}}); },
  range: el => { UI.range = +el.dataset.v; snd('tap'); render(false); },
  calnav: el => { const v = pk(UI.calM); v.setMonth(v.getMonth() + +el.dataset.v); UI.calM = dk(new Date(v.getFullYear(), v.getMonth(), 1)); UI.calSel = null; snd('tab'); render(false); const g = $('cgrid'); if (g) g.classList.add('fl'); },
  calday: el => { UI.calSel = UI.calSel === el.dataset.d ? null : el.dataset.d; snd('tap'); render(false); },
  delsess: el => arm(el, () => { const s = S.sessions.find(x => x.id === el.dataset.id); S.sessions = S.sessions.filter(x => x !== s); save(); snd('del'); render(false); toast('Session deleted', {label:'Undo', fn:() => { S.sessions.push(s); S.sessions.sort((a, b) => a.start - b.start); save(); render(false); }}); }),
  themenext: () => { const L = look(), i = THK.indexOf(L.theme); L.theme = THK[(i + 1) % THK.length]; L.card = ''; save(); applyLook(); snd('theme'); render(false); toast(`🎨 ${THEMES[L.theme].n}`); },
  look: () => { snd('tap'); sheetLook(); },
  lkth: el => { const L = look(); L.theme = el.dataset.v; L.card = ''; save(); applyLook(); snd('theme'); sheetLook(); },
  lkshape: el => { look()[el.dataset.k] = el.dataset.v; save(); applyLook(); snd('tap'); sheetLook(); },
  lkbshape: el => { const L = look(), k = el.dataset.k; L.btn[k] = L.btn[k] || {}; L.btn[k].s = el.dataset.v; save(); applyLook(); snd('tap'); sheetLook(); },
  lkall: el => { const L = look(); LBTNS.forEach(([k]) => { L.btn[k] = L.btn[k] || {}; L.btn[k].s = el.dataset.v; }); save(); applyLook(); snd('tap'); sheetLook(); },
  lkbr: el => { delete look().btn[el.dataset.k]; save(); applyLook(); snd('del'); sheetLook(); },
  lk0: el => { look()[el.dataset.k] = ''; save(); applyLook(); snd('tap'); sheetLook(); },
  lkreset: el => arm(el, () => { S.look = null; save(); applyLook(); snd('del'); sheetLook(); toast('Look reset'); }),
  lkpeek: () => { snd('tap'); document.body.classList.add('peek'); render(false); setTimeout(() => document.body.classList.remove('peek'), 3000); },
  wish: () => { WU = null; snd('tap'); sheetWish(); },
  wscr: el => { wkeep(); WU.scr = el.dataset.v; snd('tap'); sheetWish(); },
  wf: el => { wkeep(); WU.f = el.dataset.v; snd('tap'); sheetWish(); },
  wadd: () => { wkeep(); const t = WU.text.trim(); if (!t) { snd('err'); return toast('Write what you want changed'); } S.wish.push({id:'w' + uid(), t:Date.now(), text:t, scr:WU.scr, st:'todo'}); WU.text = ''; WU.f = 'todo'; save(); snd('save'); sheetWish(); wishBadge(); toast('📝 Added to your app wishlist'); },
  wnext: el => { wkeep(); const w = S.wish.find(x => x.id === el.dataset.id); if (!w) return; if (w.st === 'todo') { w.st = 'sent'; w.sentAt = Date.now(); } else { w.st = 'done'; w.doneAt = Date.now(); } save(); snd('tap'); sheetWish(); wishBadge(); },
  wback: el => { wkeep(); const w = S.wish.find(x => x.id === el.dataset.id); if (!w) return; w.st = 'todo'; save(); snd('tap'); sheetWish(); wishBadge(); },
  wdel: el => { wkeep(); const w = S.wish.find(x => x.id === el.dataset.id); if (!w) return; S.wish = S.wish.filter(x => x !== w); save(); snd('del'); sheetWish(); wishBadge(); toast('Removed from wishlist', {label:'Undo', fn:() => { S.wish.push(w); save(); wishBadge(); if (document.body.classList.contains('open') && $('wText')) sheetWish(); }}); },
  wcopy: async () => { const txt = wishText(); let ok = true; try { await navigator.clipboard.writeText(txt); } catch(e) { ok = false; $('wText').value = txt; $('wText').select(); }
    snd('tap'); toast(ok ? 'Copied · paste it to Claude' : 'Text is in the box · copy it from there', {label:'Mark sent', fn:() => { S.wish.forEach(w => { if (w.st === 'todo') { w.st = 'sent'; w.sentAt = Date.now(); } }); save(); wishBadge(); if (document.body.classList.contains('open') && $('wText')) sheetWish(); }}); },
  export: () => download(`getset-backup-${today()}.json`, JSON.stringify({...S, app:'GetSet', exported:new Date().toISOString()}, null, 1), 'application/json'),
  import: () => $('fileIn').click(),
  csv: () => { const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['Date','Start','End','Total (min)'].concat(S.steps.map(s => s.n + ' (min)'))].concat(done().map(s => [s.date, hm(s.start), hm(s.end), (totalMs(s) / MIN).toFixed(1)].concat(S.steps.map(st => { const m = stepMsIn(s, st.id); return m ? (m / MIN).toFixed(1) : ''; }))));
    download(`getset-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv'); },
  wipe: el => arm(el, () => { try { localStorage.removeItem(KEY); } catch(e) {} S = fresh(); applyLook(); closeSheet(); toast('All GetSet data deleted'); }),
};
function keepScroll(fn, to){ const s = document.querySelector('.sheet'), y = to != null ? to : s ? s.scrollTop : 0; fn(); requestAnimationFrame(() => { const n = document.querySelector('.sheet'); if (n) n.scrollTop = y; }); }
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled && A[el.dataset.act]) A[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target, d = el.dataset || {};
  if (d.est) { const st = S.steps.find(s => s.id === d.est); if (st) { st.est = el.checked; save(); snd('tap'); if ($('seList')) return; keepScroll(sheetEstimate); } return; }
  if (d.sv) { const st = S.steps.find(s => s.id === d.sv); if (st) { st.off = !el.checked; save(); snd('tap'); } return; }
  if (d.mset) { const st = S.steps.find(s => s.id === d.mset); if (st) { st.m = Math.max(0, Math.min(120, +el.value || 0)); save(); if (!$('seList')) keepScroll(sheetEstimate); } return; }
  if (d.sn) { const st = S.steps.find(s => s.id === d.sn); if (st) { st.n = el.value.trim() || st.n; save(); } return; }
  if (d.sc) { const st = S.steps.find(s => s.id === d.sc); if (st) { st.c = el.value; save(); el.closest('.se').style.setProperty('--c', el.value); } return; }
  if (el.id === 'useLeave') { S.settings.useLeave = el.checked; save(); snd('tap'); return; }
  if (el.id === 'leaveAt') { S.settings.leave = el.value || S.settings.leave; save(); return; }
});
document.addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.lk) return;
  const L = look(), k = el.dataset.lk, v = el.value, lab = el.nextElementSibling && el.nextElementSibling.tagName === 'SMALL' ? el.nextElementSibling : null;
  if (k === 'card') L.card = v; else if (k === 'tp' || k === 'cp') L[k] = +v;
  else { const [t, id] = k.split(':'); L.btn[id] = L.btn[id] || {}; if (t === 'bc') L.btn[id].c = v; else L.btn[id].a = +v; }
  if (lab) lab.textContent = v + '%'; save(); applyLook(); });
$('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.sessions)) throw 0;
      const have = new Set(S.sessions.map(x => x.id)); let n = 0; d.sessions.forEach(x => { if (!have.has(x.id) && x.end) { S.sessions.push(x); n++; } }); S.sessions.sort((a, b) => a.start - b.start);
      (d.steps || []).forEach(st => { if (!S.steps.some(x => x.id === st.id)) S.steps.push(st); });
      if (Array.isArray(d.wish)) { const hw = new Set(S.wish.map(w => w.id)); d.wish.forEach(w => { if (!hw.has(w.id)) S.wish.push(w); }); }
      if (d.look && !S.look) S.look = d.look; if (d.settings) S.settings = {...S.settings, ...d.settings};
      save(); applyLook(); closeSheet(); snd('save'); toast(`Imported ${n} session${n === 1 ? '' : 's'}`); } catch(err) { snd('err'); toast('That file is not a GetSet backup'); } };
  r.readAsText(f); };

/* ===================== demo (preview only) ===================== */
function seedDemo(){
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const base = {dress:4, table:5, brush:3.5, rest:7, bath:13, dressup:7, makeup:3, bfast:11, lunch:3, dinner:3, shoe:2.5, rapido:1.5};
  for (let i = 24; i >= 1; i--) { const day = new Date(); day.setDate(day.getDate() - i); day.setHours(6, 50 + Math.floor(rnd() * 25), 0, 0);
    if (rnd() < .15) continue; let t = day.getTime(); const s = {id:uid() + i, date:dk(day), start:t, end:null, laps:[], pauses:[], paused:null};
    S.steps.forEach(st => { if (st.id === 'dinner' && rnd() < .5) return; const m = base[st.id] * (0.7 + rnd() * .7) * (i < 10 ? .92 : 1.05); s.laps.push({step:st.id, a:t, b:t + m * MIN}); t += m * MIN; });
    s.end = t; S.sessions.push(s); }
  const s = startSession('dress'), n = Date.now(); s.start = n - 25 * MIN; s.laps = [{step:'dress', a:n - 25 * MIN, b:n - 21 * MIN}, {step:'table', a:n - 21 * MIN, b:n - 16 * MIN}, {step:'brush', a:n - 16 * MIN, b:n - 12.5 * MIN}, {step:'rest', a:n - 12.5 * MIN, b:n - 5 * MIN}, {step:'bath', a:n - 5 * MIN, b:null}];
  S.settings.sound = false;
}

/* ===================== boot ===================== */
if (window.GETSET_DEMO && !S.sessions.length) seedDemo();
applyLook(); render(true);
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.body.classList.contains('open')) render(false); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
